# The macOS jobs on the Mac Mini of the owner. It is not part of the ladder and `required` does not
# wait for it. Nothing runs until the repository variable MACOS_SELF_HOSTED is `true`, so the workflow
# is inert while the machine is offline. A pull request starts it only with the label ci:macos-self,
# and never when it comes from a fork: a self-hosted runner must not run the code of a stranger.

name: macos-selfhosted

on:
  workflow_dispatch:
  push:
    branches:
      - master
      # TEMPORARY: remove when komomono is merged to master
      - komomono
  pull_request:
    types: [labeled]

concurrency:
  group: macos-selfhosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    if: >-
      ${{ vars.MACOS_SELF_HOSTED == 'true' && (
      github.event_name != 'pull_request' || (
      github.event.label.name == 'ci:macos-self' &&
      github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/_macos.yaml
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      install-nix: false
    secrets: inherit
