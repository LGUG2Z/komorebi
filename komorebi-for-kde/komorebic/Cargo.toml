[package]
name = "komorebic-linux"
version.workspace = true
description = "The command-line interface for Komorebi, a tiling window manager for KDE Plasma"
edition = "2024"

[dependencies]
komorebi-config = { workspace = true }
komorebi = { package = "komorebi-linux", path = "../komorebi", default-features = false }
komorebi-client = { package = "komorebi-client-linux", path = "../komorebi-client", default-features = false }
komorebi-hotkeys = { path = "../komorebi-hotkeys" }
komorebic-core = { path = "../../crates/komorebic-core" }
version = { package = "version-linux", path = "../version" }

clap = { workspace = true }
clap_complete = "4"
chrono = { workspace = true }
color-eyre = { workspace = true }
dirs = { workspace = true }
fs-tail = "0.1"
lazy_static = { workspace = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }

[features]
default = ["schemars"]
schemars = ["dep:schemars", "komorebi-client/default"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(FALSE)'] }

[[bin]]
name = "komorebic"
path = "src/main.rs"
