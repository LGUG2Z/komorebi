[package]
name = "komorebi-client-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
komorebi = { package = "komorebi-linux", path = "../komorebi", default-features = false }
komorebi-themes = { path = "../../komorebi-themes" }

serde_json = { package = "serde_json_lenient", version = "0.2" }

[dev-dependencies]
parking_lot = "0.13"

[features]
default = ["schemars"]
schemars = ["komorebi/default"]

[lib]
name = "komorebi_client"
