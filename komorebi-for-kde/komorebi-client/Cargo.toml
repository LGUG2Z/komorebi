[package]
name = "komorebi-client-linux"
version.workspace = true
edition = "2024"

[dependencies]
komorebi = { package = "komorebi-linux", path = "../komorebi", default-features = false }
komorebi-themes = { workspace = true }

serde_json = { workspace = true }

[dev-dependencies]
parking_lot = "0.13"

[features]
default = ["schemars"]
schemars = ["komorebi/default"]

[lib]
name = "komorebi_client"
