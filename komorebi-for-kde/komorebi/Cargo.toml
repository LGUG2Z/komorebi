[package]
name = "komorebi-linux"
version = "0.1.0"
description = "A tiling window manager for KDE Plasma"
edition = "2024"

[dependencies]
komorebi-hotkeys = { path = "../komorebi-hotkeys" }
komorebi-themes = { path = "../../komorebi-themes" }
komorebi-backend = { path = "../../crates/komorebi-backend" }
komorebi-collections = { path = "../../crates/komorebi-collections" }
komorebi-layouts = { path = "../../komorebi-layouts", features = ["schemars"] }
komorebi-scrolling = { path = "../../komorebi-scrolling" }
komorebi-config = { path = "../../crates/komorebi-config", default-features = false, features = ["schemars"] }
komorebi-settings = { path = "../../crates/komorebi-settings" }
komorebi-protocol = { path = "../../crates/komorebi-protocol", default-features = false, features = ["schemars"] }
komorebi-transport = { path = "../../crates/komorebi-transport" }
version = { package = "version-linux", path = "../version" }

clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = { version = "0.6" }
crossbeam-channel = { version = "0.5" }
crossbeam-utils = { version = "0.8" }
ctrlc = { version = "3", features = ["termination"] }
dirs = { version = "7" }
hotwatch = { version = "0.5" }
lazy_static = { version = "1" }
nanoid = "0.5"
parking_lot = "0.13"
pastey = { version = "0.2" }
regex = "1"
schemars = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2", features = ["preserve_order"] }
serde_with = { version = "3", features = ["schemars_1"] }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = [
  "tokio",
  "proxy",
  "service",
] }
futures-util = "0.3"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[features]
default = ["schemars"]
deadlock_detection = ["parking_lot/deadlock_detection"]
schemars = ["dep:schemars", "komorebi-collections/schemars"]

[lib]
name = "komorebi"

[[bin]]
name = "komorebi"
path = "src/main.rs"
