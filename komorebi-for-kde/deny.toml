[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml comes with serde_yaml, which komorebi-layouts reads Windows-only custom layouts with; nothing here calls it" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is maintained inside zbus from zbus 6; komorebi talks to KWin with zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is maintained inside zbus from zbus 6; komorebi talks to KWin with zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is maintained inside zbus from zbus 6; komorebi talks to KWin with zbus 5" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust comes with serde_yaml 0.8 under flavours, which komorebi-themes makes palettes with; not using any yaml features from this library" },
  { id = "RUSTSEC-2025-0056", reason = "adler comes with the image decoder under flavours, which komorebi-themes makes palettes with; only used for color palette generation" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser comes with the fonts of egui, which komorebi-themes pulls in for its theme types; komorebi draws no text" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",
  "LicenseRef-Komorebi-2.0",
]
confidence-threshold = 0.8

