[package]
name = "komorebi-bar-macos"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
komorebi-bar-core = { path = "../../crates/komorebi-bar-core", default-features = false }
komorebi-client = { path = "../../komorebi-client", default-features = false }
komorebi-themes = { path = "../../komorebi-themes" }

chrono = { version = "0.4" }
chrono-tz = { version = "0.10" }
clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = { version = "0.6" }
crossbeam-channel = { version = "0.5" }
dirs = { version = "6" }
dunce = { version = "1" }
eframe = { version = "0.33" }
egui-phosphor = { git = "https://github.com/amPerl/egui-phosphor", rev = "d13688738478ecd12b426e3e74c59d6577a85b59" }
font-loader = "0.11"
hotwatch = { version = "0.5" }
icns = "0.4"
image = "0.25"
lazy_static = { version = "1" }
netdev = "0.40"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
raw-window-handle = "0.6"
parking_lot = { version = "0.12" }
random_word = { version = "0.5", features = ["en"] }
reqwest = { version = "0.12", features = ["blocking"] }
schemars = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2" }
sysinfo = { version = "0.38" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["schemars"]
schemars = [
  "dep:schemars",
  "komorebi-bar-core/schemars",
  "komorebi-client/default",
  "komorebi-themes/default",
]

[[bin]]
name = "komorebi-bar"
path = "src/main.rs"
