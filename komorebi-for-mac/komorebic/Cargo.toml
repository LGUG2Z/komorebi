[package]
name = "komorebic-macos"
version = "0.1.1"
description = "The command-line interface for Komorebi, a tiling window manager for macOS"
edition = "2024"

[dependencies]
komorebi-config = { workspace = true }
komorebi-client = { package = "komorebi-client-macos", path = "../komorebi-client", default-features = false }
komorebic-core = { path = "../../crates/komorebic-core" }
version = { package = "version-macos", path = "../version" }

clap = { workspace = true }
clap_complete = "4"
chrono = { workspace = true }
color-eyre = { workspace = true }
dirs = { workspace = true }
fs-tail = "0.1"
lazy_static = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true }
shadow-rs = { workspace = true }
sysinfo = { workspace = true }

[features]
default = ["schemars"]
schemars = ["dep:schemars", "komorebi-client/default"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(FALSE)'] }

[[bin]]
name = "komorebic"
path = "src/main.rs"
