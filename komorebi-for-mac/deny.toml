[graph]
targets = ["aarch64-apple-darwin"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is fine" },
  { id = "RUSTSEC-2024-0320", reason = "not using any yaml features from this library" },
  { id = "RUSTSEC-2025-0056", reason = "only used for colour palette generation" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is only pulled in via serde_yaml, and there is no safe upgrade available" },
  { id = "RUSTSEC-2026-0183", reason = "git2 is only used by shadow-rs at build time to read version info from our own repository" },
  { id = "RUSTSEC-2026-0184", reason = "git2 is only used by shadow-rs at build time to read version info from our own repository" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is only used to parse local, trusted XML (config conversion and plist files), not untrusted input" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml is only used to parse local, trusted XML (config conversion and plist files), not untrusted input" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is only used for font parsing in egui, and there is no safe upgrade available" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Artistic-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",

  "LicenseRef-Komorebi-2.0",
  # these are also ok, but not yet used

  #    "BSL-1.0",
  #    "MIT-0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "komorebi"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebi-client"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebi-scrolling"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebi-layouts"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebic"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebi-bar"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "komorebi-themes"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "version"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[[licenses.clarify]]
crate = "base16-egui-themes"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/LGUG2Z/quickxml_to_serde",
  "https://github.com/LGUG2Z/base16-egui-themes",
  "https://github.com/LGUG2Z/flavours",
  "https://github.com/LGUG2Z/komorebi",
  "https://github.com/LGUG2Z/base16_color_scheme",
  "https://github.com/LGUG2Z/catppuccin-egui",
  "https://github.com/amPerl/egui-phosphor",
]
