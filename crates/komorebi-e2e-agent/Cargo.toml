[package]
name = "komorebi-e2e-agent"
version.workspace = true
edition = "2024"
description = "Runs in the interactive session of an e2e guest and answers the host"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSWorkspace",
  "NSRunningApplication",
  "NSScreen",
  "libc",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "HIServices",
  "AXUIElement",
  "AXValue",
  "AXError",
  "libc",
  "Accessibility",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
  "CFArray",
  "CFNumber",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSGeometry",
  "NSArray",
  "NSDate",
  "NSRunLoop",
  "NSEnumerator",
] }
