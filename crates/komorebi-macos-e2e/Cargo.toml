[package]
name = "komorebi-macos-e2e"
version.workspace = true
edition = "2024"
description = "The guest half of the e2e suite on macOS: an agent that answers the host, and a window to tile"
publish = false

[[bin]]
name = "komorebi-macos-e2e-agent"
path = "src/bin/agent.rs"

[target.'cfg(target_os = "macos")'.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSWindow",
  "NSView",
  "NSColor",
  "NSResponder",
  "NSWorkspace",
  "NSRunningApplication",
  "NSScreen",
  "NSGraphics",
  "libc",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "HIServices",
  "AXUIElement",
  "AXValue",
  "AXError",
  "libc",
  "Accessibility",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
  "CFArray",
  "CFNumber",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSGeometry",
  "NSArray",
  "NSDate",
  "NSRunLoop",
  "NSEnumerator",
] }
