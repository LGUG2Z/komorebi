[package]
name = "komorebi-protocol"
version.workspace = true
edition = "2024"
description = "The wire types shared by every komorebi daemon and client: SocketMessage and its payloads"

[dependencies]
komorebi-layouts = { path = "../../komorebi-layouts" }
komorebi-themes = { path = "../../komorebi-themes" }

clap = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { version = "3.12", features = ["schemars_1"] }
strum = { workspace = true }

# Optional dependencies
schemars = { workspace = true, optional = true }

[dev-dependencies]
schemars = { workspace = true }

[features]
default = ["schemars"]
schemars = [
  "dep:schemars",
  "komorebi-layouts/schemars",
  "komorebi-themes/schemars",
]
