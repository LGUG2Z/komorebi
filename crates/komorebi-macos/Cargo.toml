[package]
name = "komorebi-macos"
version.workspace = true
description = "A tiling window manager for macOS"
edition = "2024"

[dependencies]
komorebi-themes = { path = "../komorebi-themes" }
komorebi-backend = { path = "../komorebi-backend" }
komorebi-collections = { path = "../komorebi-collections" }
komorebi-core = { path = "../komorebi-core" }
komorebi-layouts = { path = "../komorebi-layouts", features = [
  "darwin",
  "schemars",
] }
komorebi-config = { path = "../komorebi-config", default-features = false, features = [
  "schemars",
] }
komorebi-settings = { path = "../komorebi-settings" }
komorebi-protocol = { path = "../komorebi-protocol", default-features = false, features = [
  "schemars",
] }
komorebi-transport = { path = "../komorebi-transport" }
quickxml_to_serde = { git = "https://github.com/LGUG2Z/quickxml_to_serde.git", version = "0.6.1" }
version = { package = "komorebi-version", path = "../komorebi-version" }

base64 = "0.22"
block2 = "0.6"
clap = { version = "4", features = ["derive", "wrap_help"] }
chrono = { version = "0.4" }
color-eyre = { version = "0.6" }
crossbeam-channel = { version = "0.5" }
crossbeam-utils = { version = "0.8" }
ctrlc = { version = "3", features = ["termination"] }
dirs = { version = "6" }
dispatch2 = "0.3"
ed25519-dalek = "2"
hotwatch = { version = "0.5" }
lazy_static = { version = "1" }
nanoid = "0.4"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-quartz-core",
  "libc",
  "NSApplication",
  "NSWindow",
  "NSView",
  "NSColor",
  "NSAlert",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSWorkspace",
  "NSRunningApplication",
  "NSScreen",
  "NSEvent",
  "NSGraphics",
  "NSWindowRestoration",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXUIElement",
  "AXValue",
  "AXError",
  "AXActionConstants",
  "AXAttributeConstants",
  "AXNotificationConstants",
  "Accessibility",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFRunLoop",
  "CFMachPort",
  "CFCGTypes",
  "CFData",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "alloc",
  "CGWindow",
  "CGImage",
  "CGDataProvider",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGColor",
  "CGError",
  "CGRemoteOperation",
  "CGGeometry",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSDictionary",
  "NSBundle",
  "NSURL",
  "NSValue",
  "NSGeometry",
  "NSNotification",
  "NSDistributedNotificationCenter",
  "NSRunLoop",
  "NSDate",
  "NSKeyValueCoding",
  "NSArray",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CALayer",
  "CATransaction",
] }
parking_lot = { version = "0.12" }
pastey = { version = "0.2" }
regex = "1"
# pinning to 0.12 until this is resolved: https://github.com/seanmonstar/reqwest/issues/2924
reqwest = { version = "0.12", features = ["blocking"] }
schemars = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2", features = [
  "preserve_order",
] }
serde_with = { version = "3", features = ["schemars_1"] }
shadow-rs = { version = "1" }
strum = { version = "0.28", features = ["derive"] }
sysinfo = { version = "0.38" }
thiserror = { version = "2" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[features]
default = ["schemars"]
deadlock_detection = ["parking_lot/deadlock_detection"]
schemars = [
  "dep:schemars",
  "komorebi-collections/schemars",
  "komorebi-core/schemars",
]

[lib]
name = "komorebi"
