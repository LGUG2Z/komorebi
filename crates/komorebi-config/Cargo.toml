[package]
name = "komorebi-config"
version.workspace = true
edition = "2024"
description = "The komorebi.json data types (StaticConfig and the types it is made of) and the generation of its JSON Schema"

[dependencies]
komorebi-layouts = { path = "../../komorebi-layouts" }
komorebi-protocol = { path = "../komorebi-protocol", default-features = false }
komorebi-themes = { path = "../../komorebi-themes" }

clap = { workspace = true }
color-eyre = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_with = { version = "3.12", features = ["schemars_1"] }
serde_json = { workspace = true, features = ["preserve_order"] }
strum = { workspace = true }

# Optional dependencies
schemars = { workspace = true, optional = true }

[dev-dependencies]
schemars = { workspace = true }

[features]
default = ["schemars"]
schemars = [
  "dep:schemars",
  "komorebi-layouts/schemars",
  "komorebi-protocol/schemars",
  "komorebi-themes/schemars",
]
