[package]
name = "komorebi-bar-core"
version = "0.1.42"
description = "The status bar shared by the Windows and macOS komorebi bars: configuration, widgets and the platform seam"
edition = "2024"

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
eframe = { workspace = true }
egui-phosphor = { git = "https://github.com/amPerl/egui-phosphor", rev = "d13688738478ecd12b426e3e74c59d6577a85b59" }
lazy_static = { workspace = true }
image = "0.25"
komorebi-config = { path = "../komorebi-config", default-features = false }
reqwest = { version = "0.12", features = ["blocking"] }
komorebi-layouts = { path = "../../komorebi-layouts" }
komorebi-protocol = { path = "../komorebi-protocol", default-features = false }
serde = { workspace = true }
color-eyre = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
starship-battery = "0.11"
sysinfo = { workspace = true }
tracing = { workspace = true }

# Optional dependencies
schemars = { workspace = true, optional = true }

[features]
default = ["schemars"]
schemars = ["dep:schemars", "komorebi-config/schemars", "komorebi-layouts/schemars", "komorebi-protocol/schemars"]
