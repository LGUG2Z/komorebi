[package]
name = "komorebi-bar-core"
version = "0.1.42"
description = "The status bar shared by the Windows and macOS komorebi bars: configuration, widgets and the platform seam"
edition = "2024"

[dependencies]
eframe = { workspace = true }
serde = { workspace = true }

# Optional dependencies
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["schemars"]
schemars = ["dep:schemars"]
