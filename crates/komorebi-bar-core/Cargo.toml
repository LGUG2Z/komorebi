[package]
name = "komorebi-bar-core"
version = "0.1.42"
description = "The status bar shared by the Windows and macOS komorebi bars: configuration, widgets and the platform seam"
edition = "2024"

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
eframe = { workspace = true }
egui-phosphor = { git = "https://github.com/amPerl/egui-phosphor", rev = "d13688738478ecd12b426e3e74c59d6577a85b59" }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
starship-battery = "0.11"
sysinfo = { workspace = true }

# Optional dependencies
schemars = { workspace = true, optional = true }

[features]
default = ["schemars"]
schemars = ["dep:schemars"]
