[package]
name = "komorebi-core"
version.workspace = true
description = "The model every komorebi daemon shares, generic over the platform's window: containers first, then monitors, workspaces and the window manager"
edition = "2024"

[dependencies]
komorebi-collections = { path = "../komorebi-collections" }
komorebi-config = { path = "../komorebi-config", default-features = false }
komorebi-layouts = { path = "../komorebi-layouts" }
komorebi-protocol = { path = "../komorebi-protocol" }
komorebi-scrolling = { path = "../komorebi-scrolling" }
color-eyre = { workspace = true }
nanoid = "0.5"
schemars = { workspace = true, optional = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[features]
# derives `schemars::JsonSchema` for the model types
schemars = [
  "dep:schemars",
  "komorebi-collections/schemars",
  "komorebi-config/schemars",
  "komorebi-layouts/schemars",
]
