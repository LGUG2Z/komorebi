[package]
name = "komorebi-transport"
version = "0.1.42"
description = "The command transport shared by every komorebi daemon: the pause filter, the command listener and the subscriber registry"
edition = "2024"

[dependencies]
komorebi-protocol = { path = "../komorebi-protocol", default-features = false }
color-eyre = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
