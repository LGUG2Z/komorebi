[package]
name = "schemars-docgen"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"

[lib]
name = "schemars_docgen"
path = "src/lib.rs"

[[bin]]
name = "schemars-docgen"
path = "src/main.rs"

[dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
pulldown-cmark = "0.13"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
