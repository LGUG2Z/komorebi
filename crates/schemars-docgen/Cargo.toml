[package]
name = "schemars-docgen"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE.md"
publish = false

[lib]
name = "schemars_docgen"
path = "src/lib.rs"

[[bin]]
name = "schemars-docgen"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
pulldown-cmark = "0.13"
schemars = { workspace = true }
serde = { workspace = true }
# not the workspace's serde_json_lenient: tera takes the values of serde_json itself
serde_json = "1"
tera = "1"
thiserror = "2"
