[package]
name = "komorebic"
version.workspace = true
description = "The command-line interface for Komorebi, a tiling window manager for Windows, KDE Plasma and macOS"
repository = "https://github.com/LGUG2Z/komorebi"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The dependencies of each platform are in its own table, so that a build for one target compiles
# nothing of the others. A dependency key can only have one path, so the Linux and macOS crates
# are renamed (`komorebi-client-linux`, ...) and main.rs gives them the names the modules use.

[dependencies]
komorebi-client = { path = "../komorebi-client", default-features = false }
komorebi-config = { path = "../crates/komorebi-config", default-features = false }
komorebic-core = { path = "../crates/komorebic-core" }

chrono = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
dirs = { workspace = true }
fs-tail = "0.1"
lazy_static = { workspace = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
dunce = { workspace = true }
miette = { version = "7", features = ["fancy"] }
open = "5"
powershell_script = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { workspace = true }
shadow-rs = { workspace = true }
sysinfo = { workspace = true }
thiserror = "2"
which = { workspace = true }
win-msgbox = "0.2"
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
komorebi-linux = { package = "komorebi-linux", path = "../komorebi-for-kde/komorebi", default-features = false }
komorebi-hotkeys = { path = "../komorebi-for-kde/komorebi-hotkeys" }
version = { package = "komorebi-version", path = "../crates/komorebi-version" }
clap_complete = "4"
sysinfo = "0.40"

[target.'cfg(target_os = "macos")'.dependencies]
version = { package = "komorebi-version", path = "../crates/komorebi-version" }
clap_complete = "4"
reqwest = { version = "0.12", features = ["blocking"] }
sysinfo = "0.38"

[build-dependencies]
shadow-rs = { workspace = true }

[features]
default = ["schemars"]
schemars = [
  "dep:schemars",
  "komorebi-client/default",
  "komorebi-config/schemars",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(FALSE)'] }
