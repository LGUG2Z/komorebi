[package]
name = "komorebic"
version.workspace = true
description = "The command-line interface for Komorebi, a tiling window manager for KDE Plasma"
edition = "2024"

[dependencies]
komorebi-client = { path = "../komorebi-client", default-features = false }
version = { path = "../version" }

clap = { workspace = true }
clap_complete = "4"
chrono = { workspace = true }
color-eyre = { workspace = true }
dirs = { workspace = true }
fs-tail = "0.1"
lazy_static = { workspace = true }
pastey = { workspace = true }
sysinfo = { workspace = true }

[features]
default = ["schemars"]
schemars = ["komorebi-client/default"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(FALSE)'] }
