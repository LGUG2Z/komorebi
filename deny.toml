[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and has no safe upgrade; it is reached only through egui's font stack (eframe, egui, epaint, ab_glyph, owned_ttf_parser)" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  # clipboard-win's error-code, which eframe pulls in on Windows
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Zlib",

  "LicenseRef-Komorebi-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "komorebi-recorder"
expression = "LicenseRef-Komorebi-2.0"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
