[workspace]

resolver = "2"
members = [
  "komorebi",
  "komorebi-client",
  "komorebi-hotkeys",
  "komorebic",
  "version",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
# upstream's layouts, at a revision that has the fix for resizing a tile by dragging its edge
# (LGUG2Z/komorebi#1765) and the placement helpers komorebi for KDE uses
komorebi-layouts = { git = "https://github.com/LGUG2Z/komorebi", rev = "efe91ce33223afd2a41da35afcf0670a3ea39050", features = [
  "schemars",
] }
# the themes (and the palettes made from pictures), from the same upstream revision
komorebi-themes = { git = "https://github.com/LGUG2Z/komorebi", rev = "efe91ce33223afd2a41da35afcf0670a3ea39050" }

chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dirs = "7"
hotwatch = "0.5"
lazy_static = "1"
pastey = "0.2"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2" }
shadow-rs = "2"
sysinfo = "0.40"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.metadata.crane]
name = "komorebi-workspace"
