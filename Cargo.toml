[workspace]
resolver = "2"
members = ["komorebi-recorder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/LGUG2Z/komorebi-recorder"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
crossbeam-channel = "0.5"
dirs = "6"
dunce = "1"
eframe = "0.33"
parking_lot = "0.12"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2" }
sysinfo = "0.38"
