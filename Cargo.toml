[package]
name = "schemars-nixgen"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"

[lib]
name = "schemars_nixgen"
path = "src/lib.rs"

[[bin]]
name = "schemars-nixgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_lenient", version = "0.2" }
thiserror = "2"
